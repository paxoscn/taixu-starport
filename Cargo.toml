[package]
name = "taixu-demo"
version = "0.1.0"
edition = "2021"
default-run = "taixu-demo"
description = "Taixu Starport — a small multiplayer web game built on the taixu library"
license = "MIT OR Apache-2.0"

[dependencies]
taixu = { path = "../taixu" }
async-trait = "0.1"
axum = "0.8"
parking_lot = "0.12"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
